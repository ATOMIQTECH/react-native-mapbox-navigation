appId: com.expomapboxnavigationexample
name: Launch the example with location granted and open the scenario list
---
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: true
          permissions:
            location: inuse
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          stopApp: true
          permissions:
            location: allow
- setLocation:
    latitude: 37.7739
    longitude: -122.46173
- extendedWaitUntil:
    visible: 'Mapbox Module Test Lab'
    timeout: 180000
