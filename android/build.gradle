apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
  apply plugin: 'kotlin-android'
}

group = 'expo.modules.mapboxnavigation'
version = '2.2.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

def mapboxNavigationVersion = "3.30.1"
def mapboxMapsVersion = "11.30.1"
def mapboxDownloadsToken = (project.findProperty("MAPBOX_DOWNLOADS_TOKEN") ?: System.getenv("MAPBOX_DOWNLOADS_TOKEN") ?: "")
  .toString()
  .replace('"', '')
  .trim()

android {
  compileSdkVersion 36

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

// AGP 9's built-in Kotlin does not provide the `kotlinOptions` block on the
// `android` extension, so configuring the Kotlin target there fails once the
// guard above stops applying `kotlin-android`. The Kotlin extension's
// `compilerOptions` is the documented replacement and works on both paths: it
// is KGP's extension on AGP 8 (applied by the guard) and AGP's built-in one on
// AGP 9.
kotlin {
  compilerOptions {
    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
  }
}

repositories {
  mavenCentral()
  maven {
    url 'https://api.mapbox.com/downloads/v2/releases/maven'
    authentication {
      basic(BasicAuthentication)
    }
    credentials {
      username = "mapbox"
      password = mapboxDownloadsToken
    }
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
  implementation "androidx.activity:activity-ktx:1.8.2"
  implementation "androidx.appcompat:appcompat:1.7.0"
  
  // Mapbox Navigation SDK v3.
  //
  // v3 moved to the `com.mapbox.navigationcore` Maven group — the old
  // `com.mapbox.navigation` group has no 3.x artifacts at all, so a version
  // bump alone silently fails to resolve. The `-ndk27` variants still exist in
  // v3 and are still what we want: Mapbox recommends them when 16 KB
  // page-size support is needed.
  //
  // `ui-dropin` is gone. v3 ships no Drop-In UI, so the navigation UI is
  // assembled from `ui-components` widgets wired up through the
  // `ui-base` installer framework. See docs/v3-migration.md.
  implementation "com.mapbox.navigationcore:navigation-ndk27:$mapboxNavigationVersion"
  // Route line, route arrow, navigation camera and location puck components.
  implementation "com.mapbox.navigationcore:ui-maps-ndk27:$mapboxNavigationVersion"
  // Maneuver, trip progress, speed limit and sound button widgets.
  implementation "com.mapbox.navigationcore:ui-components-ndk27:$mapboxNavigationVersion"
  // The `ComponentInstaller` / `UIComponent` framework the widgets install through.
  implementation "com.mapbox.navigationcore:ui-base:$mapboxNavigationVersion"
  // Audio guidance (MapboxAudioGuidance moved here from ui-voice).
  implementation "com.mapbox.navigationcore:voice-ndk27:$mapboxNavigationVersion"
  // Mapbox Maps SDK is required for the Android embedded view implementation.
  implementation "com.mapbox.maps:android-ndk27:$mapboxMapsVersion"
}