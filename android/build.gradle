apply plugin: 'com.android.library'
if (project.extensions.findByName('kotlin') == null) {
  apply plugin: 'kotlin-android'
}

group = 'expo.modules.mapboxnavigation'

def packageJson = new groovy.json.JsonSlurper()
  .parseText(new File(projectDir, '../package.json').text)

version = packageJson.version

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

def mapboxNavigationVersion = packageJson.mapbox.navigation
def mapboxMapsVersion = packageJson.mapbox.maps
def mapboxDownloadsToken = (project.findProperty("MAPBOX_DOWNLOADS_TOKEN") ?: System.getenv("MAPBOX_DOWNLOADS_TOKEN") ?: "")
  .toString()
  .replace('"', '')
  .trim()

android {
  compileSdkVersion 36

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

kotlin {
  compilerOptions {
    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
  }
}

repositories {
  mavenCentral()
  maven {
    url 'https://api.mapbox.com/downloads/v2/releases/maven'
    authentication {
      basic(BasicAuthentication)
    }
    credentials {
      username = "mapbox"
      password = mapboxDownloadsToken
    }
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
  implementation "androidx.activity:activity-ktx:1.8.2"
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.constraintlayout:constraintlayout:2.1.4"
  
  implementation "com.mapbox.navigationcore:navigation-ndk27:$mapboxNavigationVersion"
  implementation "com.mapbox.navigationcore:ui-maps-ndk27:$mapboxNavigationVersion"
  implementation "com.mapbox.navigationcore:ui-components-ndk27:$mapboxNavigationVersion"
  implementation "com.mapbox.navigationcore:ui-base-ndk27:$mapboxNavigationVersion"
  implementation "com.mapbox.navigationcore:voice-ndk27:$mapboxNavigationVersion"
  implementation "com.mapbox.maps:android-ndk27:$mapboxMapsVersion"
}